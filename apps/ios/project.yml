name: CardCue
options:
  bundleIdPrefix: com.cardcue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  BillingCycleEngine:
    path: ../../packages/BillingCycleEngine

targets:
  CardCue:
    type: application
    platform: iOS
    sources:
      - path: CardCue
    dependencies:
      - package: BillingCycleEngine
        product: BillingCycleEngine
    info:
      path: CardCue/Info.plist
      properties:
        CFBundleDisplayName: CardCue
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Unlock CardCue with Face ID.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardcue.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: true

  CardCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CardCueTests
    dependencies:
      - target: CardCue
      - package: BillingCycleEngine
        product: BillingCycleEngine
