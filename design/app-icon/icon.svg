<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CardCue app icon">
  <!--
    CardCue app icon concept
    A stylized circular cycle/loop with a subtle cue notch — not a literal credit card.
    Accent: deep petrol teal on warm porcelain.
  -->
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6B63"/>
      <stop offset="100%" stop-color="#1A8A80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#F7F5F2"/>

  <!-- Outer cycle ring (open loop) -->
  <circle cx="256" cy="256" r="148"
          fill="none" stroke="url(#ring)" stroke-width="36"
          stroke-linecap="round"
          stroke-dasharray="720 210"
          transform="rotate(-40 256 256)"/>

  <!-- Cue marker / statement tick -->
  <rect x="242" y="78" width="28" height="56" rx="14" fill="#0E6B63"/>
  <rect x="242" y="378" width="28" height="56" rx="14" fill="#0E6B63" opacity="0.35"/>

  <!-- Inner progress arc -->
  <circle cx="256" cy="256" r="88"
          fill="none" stroke="#0E6B63" stroke-width="20"
          stroke-linecap="round"
          stroke-dasharray="360 200"
          transform="rotate(-90 256 256)"
          opacity="0.85"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="22" fill="#0E6B63"/>
</svg>
